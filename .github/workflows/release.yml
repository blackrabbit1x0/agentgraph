name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          targets="
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
          "
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            name="agentgraph-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
                -o "dist/${name}.exe" ./cmd/agentgraph
              (cd dist && zip -q "${name}.zip" "${name}.exe" && rm "${name}.exe")
            else
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
                -o "dist/${name}" ./cmd/agentgraph
              tar -C dist -czf "dist/${name}.tar.gz" "${name}" && rm "dist/${name}"
            fi
          done
          ls -la dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/* \
            --title "AgentGraph ${tag}" \
            --generate-notes
