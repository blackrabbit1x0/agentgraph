name: Feature request
description: Suggest a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to accomplish that AgentGraph can't do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would the solution look like?
      description: A command, an output format, a connector behavior — whatever you imagine.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connectors (new integrations)
        - Graph / path engine
        - Risk scoring
        - Remediation / policy
        - Runtime detection
        - Dashboard / visualization
        - CLI / UX
        - Other
